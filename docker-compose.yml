# Local development database.
#
# Plain Postgres with the pgvector extension compiled in, so vector search
# happens inside the same database as the relational metadata (spec section 8).
# The backend service joins this file at the FastAPI stage.

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: codebaseai-db
    environment:
      POSTGRES_USER: codebaseai
      POSTGRES_PASSWORD: codebaseai
      POSTGRES_DB: codebaseai
    ports:
      # 5433 on the host, so this never collides with a locally installed
      # Postgres already holding 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebaseai -d codebaseai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
